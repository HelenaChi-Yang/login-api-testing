<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Page</title>
    <style>
      :root {
        --tiffany-green: #0abab5;
        --border: #d9d9d9;
        --text: #1f2933;
        --page: #f6f8fa;
        --panel: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      main {
        width: min(360px, calc(100vw - 32px));
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 24px;
        color: var(--tiffany-green);
        font-size: 28px;
        line-height: 1.2;
      }

      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 14px;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        border: 1px solid var(--border);
        font-size: 15px;
      }

      button {
        width: 100%;
        height: 42px;
        margin-top: 22px;
        border: 0;
        background: var(--tiffany-green);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.7;
      }

      .status {
        min-height: 22px;
        margin: 14px 0 0;
        font-size: 14px;
        line-height: 1.5;
      }

      .status.success {
        color: #047857;
      }

      .status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Login Page</h1>

      <form id="login-form">
        <label for="account">Account</label>
        <input id="account" name="account" type="text" autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />

        <button type="submit">Login</button>
        <p id="status-message" class="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const accountInput = document.querySelector("#account");
      const passwordInput = document.querySelector("#password");
      const button = form.querySelector("button");
      const statusMessage = document.querySelector("#status-message");

      function showStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = `status ${type}`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        showStatus("", "");

        try {
          const loginResponse = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              account: accountInput.value,
              password: passwordInput.value,
            }),
          });

          if (!loginResponse.ok) {
            showStatus("Login failed", "error");
            return;
          }

          const loginBody = await loginResponse.json();
          const meResponse = await fetch("/me", {
            headers: {
              Authorization: `${loginBody.token_type} ${loginBody.access_token}`,
            },
          });

          if (!meResponse.ok) {
            showStatus("Token validation failed", "error");
            return;
          }

          const meBody = await meResponse.json();
          showStatus(`Welcome, ${meBody.account}`, "success");
        } catch {
          showStatus("API connection failed", "error");
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
